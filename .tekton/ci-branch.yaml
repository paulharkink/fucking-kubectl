apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: fucking-kubectl-ci-branch-
  namespace: ci
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && !target_branch.matches("^refs/tags/.*$") && target_branch != "main" && target_branch != "refs/heads/main"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
spec:
  taskRunTemplate:
    serviceAccountName: tekton-runner
  pipelineRef:
    resolver: git
    params:
      - name: org
        value: paulharkink
      - name: repo
        value: fucking-kubectl
      - name: revision
        value: "{{ revision }}"
      - name: pathInRepo
        value: .tekton/ci-shared-pipeline.yaml
      - name: token
        value: ci-pac-github-provider
      - name: tokenKey
        value: token
      - name: scmType
        value: github
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: source_branch
      value: "{{ source_branch }}"
    - name: target_branch
      value: "{{ target_branch }}"
    - name: mode
      value: branch
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
