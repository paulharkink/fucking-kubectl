apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: fucking-kubectl-shared-ci
  namespace: ci
spec:
  params:
    - name: repo_url
      type: string
    - name: revision
      type: string
    - name: source_branch
      type: string
      default: ""
    - name: target_branch
      type: string
      default: ""
    - name: mode
      type: string
  workspaces:
    - name: source
  tasks:
    - name: clone-source
      taskSpec:
        params:
          - name: repo_url
            type: string
          - name: revision
            type: string
          - name: source_branch
            type: string
        workspaces:
          - name: source
        volumes:
          - name: github-app
            secret:
              secretName: ci-github-app
          - name: github-helper
            configMap:
              name: github-app-helper
              defaultMode: 493
        steps:
          - name: clone
            image: alpine/git:2.45.2
            computeResources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: "500m"
                memory: 512Mi
            volumeMounts:
              - name: github-app
                mountPath: /var/secrets/github-app
              - name: github-helper
                mountPath: /helpers
            script: |
              set -eux
              apk add --no-cache openssl curl jq >/dev/null 2>&1
              REPO_PATH=$(printf "%s" "$(params.repo_url)" | sed -e 's#^https://github.com/##' -e 's#^git@github.com:##' -e 's#\.git$##')
              rm -rf "$(workspaces.source.path)/src"
              /helpers/github-app-git-setup.sh /var/secrets/github-app
              git clone "https://github.com/${REPO_PATH}.git" "$(workspaces.source.path)/src"
              cd "$(workspaces.source.path)/src"
              git checkout "$(params.revision)" || git checkout "origin/$(params.source_branch)"
      params:
        - name: repo_url
          value: "$(params.repo_url)"
        - name: revision
          value: "$(params.revision)"
        - name: source_branch
          value: "$(params.source_branch)"
      workspaces:
        - name: source
          workspace: source

    - name: test
      when:
        - input: "$(params.mode)"
          operator: in
          values: ["branch", "main", "pr"]
      runAfter: ["clone-source"]
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: shell-tests
            image: alpine:3.23
            computeResources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: "500m"
                memory: 512Mi
            script: |
              set -eux
              apk add --no-cache bash jq zsh >/dev/null
              cd "$(workspaces.source.path)/src"
              tests/pretty-logs.sh
              bash -n bin/please bin/fucking bin/fucking-kubectl completions/please.bash completions/fucking.bash
              zsh -n completions/_please completions/_fucking
      workspaces:
        - name: source
          workspace: source
