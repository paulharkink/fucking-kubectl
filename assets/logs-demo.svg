<svg width="960" height="390" viewBox="0 0 960 390" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Readable log output from please show</title>
  <desc id="desc">Terminal screenshot showing dim timestamps, colored log levels, highlighted logger names, and muted continuation lines.</desc>
  <rect width="960" height="390" rx="10" fill="#101317"/>
  <rect x="0" y="0" width="960" height="38" rx="10" fill="#1c2027"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="19" r="6" fill="#28c840"/>
  <text x="84" y="24" fill="#a8b1bd" font-family="Menlo, Consolas, monospace" font-size="13">please show</text>

  <g font-family="Menlo, Consolas, monospace" font-size="16">
    <text x="24" y="70" fill="#c9d1d9">$ please show argocd-notifications-controller notifications-controller</text>

    <text x="24" y="110" fill="#7d8590">2026-06-05T14:40:19Z</text>
    <text x="248" y="110" fill="#3fb950">info</text>
    <text x="302" y="110" fill="#58a6ff">notifications</text>
    <text x="430" y="110" fill="#c9d1d9">Start processing resource=argocd/plane</text>

    <text x="24" y="140" fill="#7d8590">2026-06-05T14:40:19Z</text>
    <text x="248" y="140" fill="#3fb950">info</text>
    <text x="302" y="140" fill="#58a6ff">notifications</text>
    <text x="430" y="140" fill="#c9d1d9">Processing completed resource=argocd/plane</text>

    <text x="24" y="190" fill="#c9d1d9">$ please show argocd-dex-server dex-server --all</text>

    <text x="24" y="230" fill="#7d8590">time=2026-06-05T13:56:09.887Z</text>
    <text x="336" y="230" fill="#c9d1d9">level=</text>
    <text x="392" y="230" fill="#3fb950">INFO</text>
    <text x="440" y="230" fill="#c9d1d9">msg="keys expired, rotating"</text>

    <text x="24" y="260" fill="#7d8590">time=2026-06-05T13:56:09.938Z</text>
    <text x="336" y="260" fill="#c9d1d9">level=</text>
    <text x="392" y="260" fill="#3fb950">INFO</text>
    <text x="440" y="260" fill="#c9d1d9">msg="keys rotated" next_rotation=2026-06-05T19:56:09.938Z</text>

    <text x="24" y="310" fill="#c9d1d9">$ please show api-7d9f8b6c9d-j2k4m app</text>
    <text x="24" y="340" fill="#f85149">ERROR</text>
    <text x="84" y="340" fill="#c9d1d9">Failed to process message</text>
    <text x="24" y="368" fill="#8b949e">    at com.example.Worker.run(Worker.java:42)</text>
  </g>
</svg>
